<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Previous photo">&#8249;</button>
  <img class="lightbox-img" id="lightboxImg" src="" alt="">
  <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Next photo">&#8250;</button>
  <div class="lightbox-caption" id="lightboxCaption"></div>
</div>

<script>
(function () {
  var tiles = Array.prototype.slice.call(document.querySelectorAll('.photo-tile'));
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightboxImg');
  var lightboxCaption = document.getElementById('lightboxCaption');
  var current = 0;

  function open(index) {
    current = index;
    var tile = tiles[current];
    lightboxImg.src = tile.getAttribute('href');
    lightboxImg.alt = tile.querySelector('img').alt;
    lightboxCaption.textContent = tile.getAttribute('data-caption') || '';
    lightbox.classList.add('is-open');
    document.body.style.overflow = 'hidden';
  }

  function close() {
    lightbox.classList.remove('is-open');
    lightboxImg.src = '';
    document.body.style.overflow = '';
  }

  function show(delta) {
    current = (current + delta + tiles.length) % tiles.length;
    open(current);
  }

  tiles.forEach(function (tile, index) {
    tile.addEventListener('click', function (e) {
      e.preventDefault();
      open(index);
    });
  });

  document.getElementById('lightboxClose').addEventListener('click', close);
  document.getElementById('lightboxPrev').addEventListener('click', function () { show(-1); });
  document.getElementById('lightboxNext').addEventListener('click', function () { show(1); });

  lightbox.addEventListener('click', function (e) {
    if (e.target === lightbox) close();
  });

  document.addEventListener('keydown', function (e) {
    if (!lightbox.classList.contains('is-open')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') show(-1);
    if (e.key === 'ArrowRight') show(1);
  });
})();
</script>
